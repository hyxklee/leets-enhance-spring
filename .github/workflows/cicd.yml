name: Java CI with Gradle

on:
  push:
    branches: [ "hyxklee" ]

env:
  PROJECT_NAME: leets_hyuk_project
  BUCKET_NAME: leets-hyxk-cd
  CODE_DEPLOY_APP_NAME: hyxk-cd
  DEPLOYMENT_GROUP_NAME: leets-hyxk-cd-instance

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle caching - 빌드 시간 향상
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      # 도커 이미지 생성 후 이미지 push
      - name: Docker build & push to dev
        if: contains(github.ref, 'develop')
        run: |
          docker login -u ${{ DOCKER_USER_NAME }} -p ${{ DOCKER_USER_PW }}
          docker build -f Dockerfile-dev -t hyxklee/hyxklee-test .
          docker push hyxklee/hyxklee-test

    #EC2 ssh 연결 후 이미지 pull
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs: GITHUB_SHA
        script: |
          sudo docker rm -f $(docker ps -qa)
          sudo docker pull hyxklee/hyxklee-test
          sudo docker run --name spring -d -p 8080:8080 -e RDS_USER_NAME=${{ RDS_USER_NAME }} -e RDS_USER_PW=${{ RDS_USER_PW }} hyxklee/hyxklee-test